name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Byte-compile (syntax check)
        run: python -m compileall -q gate_micro_mm.py micro_cap_trading_bot.py

      - name: Lint with ruff
        run: ruff check --select E9,F63,F7,F82 .

      - name: Import smoke test
        env:
          MM_LOG_FILE: ""        # disable file logging in CI
        run: python -c "import gate_micro_mm; print('import OK')"
